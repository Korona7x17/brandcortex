<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-3);margin-bottom:8px}.stack{display:flex;flex-direction:column;gap:16px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../ds-preview.js"></script>
<script type="text/babel">
const NS = (() => {
  const skip = new Set(['top','parent','self','window','frames','opener']);
  for (const k of Object.keys(window)) {
    if (skip.has(k)) continue;
    try {
      const v = window[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && v.Button && v.Tag) return v;
    } catch (e) { /* cross-origin frame ref */ }
  }
  return {};
})();

const { Terminal, InstallPanel } = NS;
function Demo(){
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 340px',gap:20,alignItems:'start'}}>
      <Terminal meta="00:00:42" cursor>
        <span className="dim"># find a skill</span>{'\n'}
        <span className="pr">$</span> <span className="cmd">npx skills search "react"</span>{'\n'}
        <span className="ok">→ 12 results · sorted by installs</span>{'\n\n'}
        <span className="pr">$</span> <span className="cmd">npx skills add vercel-labs/react-best-practices</span>{'\n'}
        <span className="ok">  verifying signature… ok</span>{'\n'}
        <span className="ok">  installed → ~/.claude/skills/</span>{'\n\n'}
        <span className="pr">$</span>{' '}
      </Terminal>
      <InstallPanel
        stats={[{v:'271K',l:'Installs'},{v:'3,240',l:'Stars'},{v:'98%',l:'Compat'},{v:'v3.2',l:'Latest'}]}
        methods={[
          {label:'CLI',command:'$ npx skills add vercel-labs/find-skills',note:'via CLI'},
          {label:'Manual',command:'# Drop SKILL.md into ~/.claude/skills/',note:'no CLI'},
          {label:'Git',command:'$ git clone github.com/vercel-labs/find-skills',note:'from source'}]} />
    </div>
  );
}
const root = document.getElementById('root');
if (Object.keys(NS).length === 0) {
  root.innerHTML = '<div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-2);border:1px solid var(--line);padding:20px">Components unavailable — could not load component sources</div>';
} else {
  ReactDOM.createRoot(root).render(<Demo />);
}
</script></body></html>
