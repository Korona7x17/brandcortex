<!-- @dsCard group="Components" viewport="700x300" name="Core" subtitle="Button, Tag, Rank, MicroLabel, Monogram, Breadcrumbs, Icon" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-3);margin-bottom:8px}.stack{display:flex;flex-direction:column;gap:16px}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script src="../../ds-preview.js"></script>
<script type="text/babel">
const NS = (() => {
  const skip = new Set(['top','parent','self','window','frames','opener']);
  for (const k of Object.keys(window)) {
    if (skip.has(k)) continue;
    try {
      const v = window[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && v.Button && v.Tag) return v;
    } catch (e) { /* cross-origin frame ref */ }
  }
  return {};
})();

const { Button, Tag, Rank, MicroLabel, Monogram, Breadcrumbs, Icon } = NS;
function Demo(){
  return (
    <div className="stack">
      <div><div className="lbl">Button</div><div className="row">
        <Button arrow>Browse the index</Button>
        <Button variant="ghost" arrow="↗">Submit a skill</Button>
        <Button disabled>Disabled</Button>
      </div></div>
      <div><div className="lbl">Rank · Tag</div><div className="row">
        <Rank rank="S" /><Rank rank="A" /><Rank rank="B" /><Rank rank="C" />
        <span style={{width:12}} />
        <Tag variant="solid">Web Dev</Tag><Tag>Claude</Tag><Tag>Cursor</Tag><Tag variant="ink">Official</Tag>
      </div></div>
      <div><div className="lbl">Monogram · Icon</div><div className="row">
        <Monogram name="GitHub" /><Monogram name="Claude Code" size={36} />
        <span style={{width:12}} />
        {['search','terminal','download','star','shield','zap'].map(n=><Icon key={n} name={n} size={20} />)}
      </div></div>
      <div><div className="lbl">Breadcrumbs · MicroLabel</div><div className="row" style={{gap:24}}>
        <Breadcrumbs items={[{label:'Index',href:'#'},{label:'Productivity',href:'#'},{label:'Find Skills'}]} />
        <MicroLabel>02 · Featured</MicroLabel>
      </div></div>
    </div>
  );
}
const root = document.getElementById('root');
if (Object.keys(NS).length === 0) {
  root.innerHTML = '<div style="font-family:var(--font-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute-2);border:1px solid var(--line);padding:20px">Components unavailable — could not load component sources</div>';
} else {
  ReactDOM.createRoot(root).render(<Demo />);
}
</script></body></html>
