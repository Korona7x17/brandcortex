<!-- @dsCard group="Brand" viewport="700x170" name="Badges & pills" subtitle="Emphasis by inversion, never by colour" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
<span class="ds-rank ds-rank--s">S-rank</span><span class="ds-rank">A-rank</span><span class="ds-rank">B-rank</span><span class="ds-rank">C-rank</span>
<span class="ds-nano" style="margin-left:8px">S inverts · A/B/C stay hairline</span></div>
<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line)">
<span class="ds-tag ds-tag--solid">Web Dev</span><span class="ds-tag">Claude</span><span class="ds-tag">Cursor</span><span class="ds-tag ds-tag--ink">Featured</span>
<span class="ds-nano" style="margin-left:8px">one solid category · hairline platforms</span></div>
<div style="display:flex;gap:12px;align-items:center;padding-top:14px;border-top:1px solid var(--line)">
<div class="ds-monogram" style="width:42px;height:42px;font-size:14px">GH</div>
<div class="ds-monogram" style="width:36px;height:36px;font-size:12px">ST</div>
<span class="ds-nano">monograms stand in for third-party marks</span></div>
</div>
</body></html>
