<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:flex;gap:28px;align-items:center;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:8px"><span class="ds-dot ds-dot--live"></span><span class="ds-nano">pulse · 2s · live status</span></div>
<div style="display:flex;align-items:center;gap:8px;background:var(--ink);padding:8px 12px"><span class="ds-terminal__cursor"></span><span class="ds-nano" style="color:var(--on-ink-mute)">blink · 1s · terminal</span></div>
<a class="ds-btn" href="#">Hover me <span class="ds-btn__arrow">→</span></a>
</div>
<p style="margin:14px 0 0;font-size:12px;color:var(--mute-1);line-height:1.6;max-width:56ch">No scroll-jacking, no parallax, no reveal-on-scroll, no page transitions. The page should read as a document, not an experience.</p>
</body></html>
