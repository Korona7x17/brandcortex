<!-- @dsCard group="Brand" viewport="700x170" name="Radius & elevation" subtitle="Both are zero — the system is square and flat" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:flex;gap:24px;align-items:center">
<div style="width:110px;height:70px;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">0 radius</div>
<div style="width:110px;height:70px;border:1px solid var(--line);background:var(--paper-2);display:grid;place-items:center;font-family:var(--font-mono);font-size:11px">0 shadow</div>
<p style="margin:0;font-size:12px;color:var(--mute-1);line-height:1.6;max-width:38ch">No element in the system has a corner radius or a box-shadow. The only exceptions are the 6px status dot and the 3px <code style="font-family:var(--font-mono)">kbd</code> chip in the search trigger.</p>
</div>
</body></html>
