<!-- @dsCard group="Colors" viewport="700x150" name="Ink" subtitle="Text and fills — the darkest three steps" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--ink);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--ink</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#0a0a0a</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--ink-2);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--ink-2</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#161616</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--ink-3);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--ink-3</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#262626</div></div>
</div>
</body></html>
