<!-- @dsCard group="Colors" viewport="700x170" name="On ink" subtitle="Values used inside black bands and terminals" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper);font-family:var(--font-sans)}body{padding:0}</style>
</head><body>
<div style="background:var(--ink);padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--on-ink);border:1px solid var(--on-ink-line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-ink-mute)">--on-ink</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--on-ink-faint)">#ffffff</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--on-ink-2);border:1px solid var(--on-ink-line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-ink-mute)">--on-ink-2</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--on-ink-faint)">#cfcfcf</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--on-ink-3);border:1px solid var(--on-ink-line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-ink-mute)">--on-ink-3</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--on-ink-faint)">#a8a8a8</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--on-ink-line);border:1px solid var(--on-ink-line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-ink-mute)">--on-ink-line</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--on-ink-faint)">#1f1f1f</div></div>
</div>
</body></html>
