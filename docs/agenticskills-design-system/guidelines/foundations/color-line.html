<!-- @dsCard group="Colors" viewport="700x150" name="Line" subtitle="Hairline rules — the system's only separator" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--line-3);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--line-3</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#f0f0f0</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--line);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--line</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#e6e6e6</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--line-2);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--line-2</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#dcdcdc</div></div>
</div>
</body></html>
