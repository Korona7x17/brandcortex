<!-- @dsCard group="Colors" viewport="700x150" name="Mute" subtitle="De-emphasised text, lightest is placeholder-only" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--mute-1);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--mute-1</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#3d3d3d</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--mute-2);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--mute-2</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#6b6b6b</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--mute-3);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--mute-3</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#9a9a9a</div></div>
</div>
</body></html>
