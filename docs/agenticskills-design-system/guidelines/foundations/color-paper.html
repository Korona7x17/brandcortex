<!-- @dsCard group="Colors" viewport="700x150" name="Paper" subtitle="Surfaces — alternate sections step one shade down" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
<div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--paper);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--paper</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#ffffff</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--paper-2);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--paper-2</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#fafafa</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--paper-3);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--paper-3</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#f4f4f4</div></div><div style="display:flex;flex-direction:column;gap:6px">
<div style="height:56px;background:var(--paper-4);border:1px solid var(--line)"></div>
<div style="font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute-2)">--paper-4</div>
<div style="font-family:var(--font-mono);font-size:10px;color:var(--mute-3)">#ededed</div></div>
</div>
</body></html>
