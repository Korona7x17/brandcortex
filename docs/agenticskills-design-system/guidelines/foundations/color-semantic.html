<!-- @dsCard group="Colors" viewport="700x190" name="Semantic aliases" subtitle="Prefer these over raw scale values" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:0 32px;font-family:var(--font-mono);font-size:11px">
<div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)">
<span style="color:var(--ink)">--text-primary</span><span style="color:var(--mute-2)">--ink</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)">
<span style="color:var(--ink)">--text-body</span><span style="color:var(--mute-2)">--ink-3</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)">
<span style="color:var(--ink)">--text-lede</span><span style="color:var(--mute-2)">--mute-1</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)">
<span style="color:var(--ink)">--text-meta</span><span style="color:var(--mute-2)">--mute-2</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)">
<span style="color:var(--ink)">--surface-page</span><span style="color:var(--mute-2)">--paper</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)">
<span style="color:var(--ink)">--surface-alt</span><span style="color:var(--mute-2)">--paper-2</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)">
<span style="color:var(--ink)">--rule</span><span style="color:var(--mute-2)">--line</span></div><div style="display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)">
<span style="color:var(--ink)">--rule-strong</span><span style="color:var(--mute-2)">--ink</span></div>
</div>
</body></html>
