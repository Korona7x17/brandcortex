<!-- @dsCard group="Spacing" viewport="700x180" name="Section rhythm" subtitle="Vertical padding between major regions" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<link rel="stylesheet" href="../../styles.css"/>
<style>body{padding:20px;background:var(--paper);font-family:var(--font-sans)}</style>
</head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="border-top:2px solid var(--ink);padding-top:10px">
<div style="font-family:var(--font-mono);font-size:20px;letter-spacing:-.02em">64px</div>
<div class="ds-nano" style="margin-top:4px">--section-sm</div>
<div style="font-size:11px;color:var(--mute-2);margin-top:6px;line-height:1.45">Tight bands, filter rows</div></div><div style="border-top:2px solid var(--ink);padding-top:10px">
<div style="font-family:var(--font-mono);font-size:20px;letter-spacing:-.02em">80px</div>
<div class="ds-nano" style="margin-top:4px">--section-md</div>
<div style="font-size:11px;color:var(--mute-2);margin-top:6px;line-height:1.45">Standard interior section</div></div><div style="border-top:2px solid var(--ink);padding-top:10px">
<div style="font-family:var(--font-mono);font-size:20px;letter-spacing:-.02em">96px</div>
<div class="ds-nano" style="margin-top:4px">--section-lg</div>
<div style="font-size:11px;color:var(--mute-2);margin-top:6px;line-height:1.45">Homepage sections</div></div><div style="border-top:2px solid var(--ink);padding-top:10px">
<div style="font-family:var(--font-mono);font-size:20px;letter-spacing:-.02em">120px</div>
<div class="ds-nano" style="margin-top:4px">--section-xl</div>
<div style="font-size:11px;color:var(--mute-2);margin-top:6px;line-height:1.45">Newsletter band</div></div>
</div>
</body></html>
