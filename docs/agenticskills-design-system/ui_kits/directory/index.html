<script>
/* Hoist the compiled design-system namespace onto window so each Babel
   script (which gets its own scope) can destructure from it. */
(function () {
  const skip = new Set(['top','parent','self','window','frames','opener']);
  for (const k of Object.keys(window)) {
    if (skip.has(k)) continue;
    try {
      const v = window[k];
      if (v && typeof v === 'object' && !Array.isArray(v) && v.Button && v.Tag && v.HairlineGrid) {
        Object.assign(window, v);
        return;
      }
    } catch (e) { /* cross-origin frame ref */ }
  }
  document.getElementById('root').innerHTML =
    '<div id="fallback">Components unavailable — could not load component sources.</div>';
  window.__DS_MISSING__ = true;
})();
</script>
<script type="text/babel" src="Shell.jsx"></script>
